name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      source-changed: ${{ steps.filter.outputs.source-changed }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Check for changes
      id: filter
      shell: bash
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          echo "source-changed=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          if git diff --quiet HEAD~1 -- src/ public/ package.json tsconfig.json vite.config.ts biome.json postcss.config.js components.json index.html '*.config.js' '*.config.ts'; then
            echo "source-changed=false" >> $GITHUB_OUTPUT
          else
            echo "source-changed=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "source-changed=true" >> $GITHUB_OUTPUT
        fi
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}

  build-and-deploy:
    needs: check-changes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      if: needs.check-changes.outputs.source-changed == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Setup pnpm
      if: needs.check-changes.outputs.source-changed == 'true'
      uses: pnpm/action-setup@v4
      with:
        version: 10
        run_install: false

    - name: Get pnpm store directory
      if: needs.check-changes.outputs.source-changed == 'true'
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      if: needs.check-changes.outputs.source-changed == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      if: needs.check-changes.outputs.source-changed == 'true'
      run: pnpm install --frozen-lockfile

    - name: Build application
      if: needs.check-changes.outputs.source-changed == 'true'
      run: GITHUB_PAGES=true pnpm run build
      env:
        VITE_GA_ID: ${{ secrets.VITE_GA_ID }}

    - name: Run linting
      if: needs.check-changes.outputs.source-changed == 'true'
      run: pnpm run lint

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && needs.check-changes.outputs.source-changed == 'true'
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.PERSONAL_TOKEN }}
        publish_dir: ./dist
        external_repository: tech-andgar/image-to-pdf-client-public

  e2e:
    name: Post-deploy E2E smoke tests
    needs: [check-changes, build-and-deploy]
    if: github.ref == 'refs/heads/main' && needs.check-changes.outputs.source-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        run_install: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium firefox webkit

    - name: Wait for GitHub Pages to propagate
      run: |
        echo "Waiting 60s for image-to-pdf-client-public to finish deploying..."
        sleep 60
        for i in $(seq 1 6); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://tech-andgar.github.io/image-to-pdf-client-public/")
          if [ "$STATUS" = "200" ]; then echo "Pages ready (attempt $i)"; break; fi
          echo "Attempt $i: status $STATUS, waiting 10s..."
          sleep 10
        done

    - name: Run E2E smoke tests
      run: pnpm test:e2e --reporter=list

  release:
    name: Tag & GitHub Release
    needs: [check-changes, build-and-deploy, e2e]
    if: github.ref == 'refs/heads/main' && needs.check-changes.outputs.source-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Read version from package.json
      id: pkg
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Check if tag already exists
      id: tag_check
      run: |
        if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract changelog entry
      if: steps.tag_check.outputs.exists == 'false'
      id: changelog
      run: |
        VERSION="${{ steps.pkg.outputs.version }}"
        NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create tag and GitHub Release
      if: steps.tag_check.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.pkg.outputs.version }}
        name: v${{ steps.pkg.outputs.version }}
        body: ${{ steps.changelog.outputs.notes }}
